name: Refresh GitHub data

# Daily snapshot of public repos + contribution calendar → src/data/github.json.
# Commits only when something changed; the push triggers Vercel's Git deployment.
on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily (08:47 IST)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-github-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The script only uses Node built-ins — no npm install needed.
      - name: Fetch snapshot
        run: node scripts/fetch-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/github.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github.json
          git commit -m "chore(data): refresh GitHub snapshot"
          git push
